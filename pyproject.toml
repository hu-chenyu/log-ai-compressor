[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log-ai-compressor"
version = "2.9.6"
description = "本机日志取证层：每条结论带行号出处与原文 sha256，可脱离本工具自校验；拿不出因果链就说证据不足并列出还缺什么。零出网。附 Loghub 2.0 可复现基准（对照 Drain3 / tail / grep）。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["log", "analyzer", "llm", "compressor", "troubleshooting",
            "benchmark", "reproducible", "root-cause", "local-first",
            "forensics", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]
# 硬依赖只有 PyYAML —— core/rules/export 三个层零三方依赖，
# 可以在任何环境（CI 容器、嵌入式、被锁依赖的公司环境）里直接跑。
# Web / MCP / AI 全部做成可选 extra：重依赖会直接劝退 PyPI 用户。
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 本地 Web 界面（双击 start.bat 走这条）
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=1.6",
]
# MCP Server：让 Claude Code / Codex / mavis 等 Agent 调用本机日志
# 不再需要环境标记 —— 那是 Python 3.9 时代的产物（mcp SDK 0.9.1 起要求
# >= 3.10，3.9 上 pip 会跳过这一项）。地板已抬到 3.11，标记纯属噪音。
mcp = [
    "mcp>=1.0",
]
# AI 解读（OpenAI 兼容端点 / 本地 Ollama 都走它）
ai = [
    "httpx>=0.27",
]
# 常用组合
all = [
    "log-ai-compressor[web,mcp,ai]",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.1", "ruff>=0.4",
       # 交付物完整性门禁要真的跑，就必须在跑测试前先构建产物
        "build>=1.0",
        # 基准对照工具。装不装都不影响主包 —— 硬依赖仍然只有 PyYAML；
        # 缺任一个时 benchmark_loghub.py 会跳过该对照臂而不是崩。
        "drain3>=0.9.11",
        "logslop>=0.1.2"]

[project.scripts]
log-ai-compressor = "log_ai_compressor.cli:main"
# 独立 MCP 入口。MCP 客户端与官方 Registry 按「可执行名 = 包名」的约定
# 拉起服务器（uvx log-ai-compressor），而主 CLI 需要子命令，裸跑只会
# 打印 usage 并以退出码 2 结束 —— 客户端拿到的是一段帮助文本而不是
# MCP 服务器。有了这个入口，Registry 收录才能真正开箱即用。
log-ai-compressor-mcp = "log_ai_compressor.cli:main_mcp"

[project.urls]
Homepage = "https://github.com/hu-chenyu/log-ai-compressor"
Repository = "https://github.com/hu-chenyu/log-ai-compressor"

[tool.setuptools.packages.find]
include = ["log_ai_compressor*"]

[tool.setuptools.package-data]
# PEP 561 标记：全项目写了完整类型注解（from __future__ import annotations
# + Optional[...]），但没有这个文件，下游 mypy / IDE 拿不到任何类型信息，
# 注解就只是给人看的注释。空文件即可，内容由 mypy 从源码读取。
"log_ai_compressor" = ["py.typed"]
"log_ai_compressor.rules" = ["presets/*.yaml"]
# 前端是零构建的静态资源，必须打进包里，否则 pip 安装后界面 404
"log_ai_compressor.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
ignore = ["E741"]

[tool.coverage.run]
# 覆盖率面向核心逻辑 + 接入层（service 是 Web/MCP 共用的门面，必须计入）
omit = [
    "log_ai_compressor/cli.py",
]

[tool.coverage.report]
show_missing = true
