name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，避免队列堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false          # 矩阵里任一格失败不影响其它格的结果可见性
      matrix:
        include:
          # 三条矩阵的理由（别随手加）：
          #   3.11 = pyproject 的 requires-python 下限，改这里必须同步改那边
          #   3.12 = 当前最常用的版本
          #   windows = 行尾 / shell / 路径处理与 unix 不同，且本项目有
          #            start.bat 这个 Windows 一等入口，必须真机验
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    # 核心层测试只要十几秒，卡住说明出了问题。
    # 这一条**只**用来抓真正的卡死 —— 耗时差一个数量级的第七道门禁
    # （变异记分卡）已经拆到独立的 `mutation` job 去了，见那里的说明。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # 必须取完整历史：tests/test_no_job_wording.py 要扫「全部历史版本
          # 的文件内容」与「全部提交信息」。默认的浅克隆只带 1 个 commit，
          # 那道门禁就会退化成只看当前那一个版本 —— 而它**看起来在跑**。
          # 这正是「扫了 0 个文件却报通过」那个形态的翻版。
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 关键：requirements-dev.txt 必须是合法的 pip requirements 文件。
          # 它内部是 `-r requirements.txt` + `-e .[web,mcp,ai]` + 测试工具，
          # 装的是本项目本体加运行时可选能力 —— 否则 test_web / test_mcp /
          # test_ai 会被 importorskip 跳过或因缺 httpx 在收集阶段就报错。
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check log_ai_compressor tests scripts

      - name: SAST (bandit baseline reconciliation)
        # 第八道门禁。「bandit 有没有报」不是问题 —— 一开就是几十条，
        # 逐条 nosec 等于没有检查。问题是「哪几条我知道、我判断过、
        # 我写下了理由」，所以这道门禁对账的是 docs/sast_baseline.json：
        #   新发现 -> 红（真问题就修，不该修就写理由加进去）
        #   数量对不上 -> 红
        #   豁免过期（代码里已经不报了，基线里还留着）-> 红
        #   豁免没写 reason -> 红
        run: python scripts/sast_gate.py

      - name: Dependency vulnerability scan (pip-audit)
        # 第九道门禁。依赖来源唯一：pyproject.toml 的 dependencies +
        # optional-dependencies。本项目硬依赖只有 PyYAML 一条，这个门禁
        # 之所以还留着，是因为「只有一个依赖」这句话必须是被扫过的。
        # --self-check 先用 urllib3==1.25.8 做阳性对照证明它会红。
        run: python scripts/dep_audit_gate.py --self-check

      - name: Adversarial evaluation (scorecard)
        # 这个项目的核心主张是「拿不出因果链就说证据不足」。主张不需要
        # 证明，但**必须被检验**：这里跑的是专门设计来误导本工具的场景
        # 集，按四条硬规则打分。「本来该弃权却给了 CONFIRMED 根因」会
        # 直接让 CI 变红 —— 那类回归等到值班时才发现就太晚了。
        # 弃权算通过：只算命中率的评测会偏好猜得最自信的系统。
        run: python scripts/adversarial_eval.py

      - name: Determinism check (same input -> same fingerprint)
        # 确定性是本工具被公开宣传的数字之一，必须由 CI 守住而不是口头
        # 承诺：同一份日志连跑三次，结论指纹必须逐字节相同。
        shell: python
        run: |
          import subprocess
          import sys

          code = (
              "import sys;"
              "sys.path.insert(0, '.');"
              "from log_ai_compressor import service as S;"
              "fps = {S.result_to_dict("
              "    S.analyze(paths=['examples/sample_system.log'],"
              "              params={'context_lines': 2}),"
              "    with_samples=False)['determinism_fingerprint']"
              "    for _ in range(3)};"
              "print('fingerprints =', len(fps));"
              "sys.exit(0 if len(fps) == 1 else 1)"
          )
          rc = subprocess.call([sys.executable, "-c", code])
          if rc != 0:
              print("确定性校验失败：同一份输入产生了不同的结论指纹")
          sys.exit(rc)

      - name: Self-proof (every README claim must hold)
        # README 里写的每一个数字都在这里被重新验一遍。理由很直接：
        # 一份没人复现过的数字等于营销，而这个脚本失败时 CI 会红 ——
        # 文档和产品不允许各自漂移。它同时把**尚无数据的主张**打印出来，
        # 缺口必须留在明面上，不能靠沉默掩盖。
        run: python scripts/prove.py

      - name: Build sdist and wheel
        # 交付物完整性门禁（tests/test_sdist_contents.py 的产物层）只在
        # dist/ 下存在包时才执行，否则 5 条全 skip —— 也就是说"README 引用的
        # 每个文件都得在包里"这条承诺**在 CI 上从来没被验证过**。
        # 2.1.0 就是在这里漏掉 start.bat / 首图 / SKILL.md 的。
        # 先构建，再跑测试，那 5 条才会真正执行。
        run: python -m build --sdist --wheel

      - name: Release artifact audit (content + self-consistency)
        # **仓库干净 ≠ 产物干净。** 2026-10-21 实测：措辞门禁在仓库上 0 命中，
        # 而 PyPI 上的最新发布版 2.12.3 是**措辞清理之前**构建的 —— 产物里
        # 实测 88 处、38 个文件，其中产品代码 9 处（含一个真实内部主机名）。
        # 清理只改了仓库、没重建产物，而 PyPI 不允许覆盖已发布文件，
        # 那一版**永远留在那儿**。
        #
        # 这一步查两件事：
        #   1. **内容口径** —— 产物里的每个文本文件，用门禁那套词表再扫一遍；
        #   2. **自洽性** —— 把 sdist 解包后，在解包目录里跑它自带的
        #      scripts/sast_gate.py（v2.12.2 的 sdist 就是这么红的：
        #      基线写 3 条、代码实测 4 条）。
        #
        # 与 OS / Python 版本无关，但**三矩阵都跑** —— 产物内容的门禁不该
        # 只在一条矩阵上存在（这与「变异记分卡只跑一条」正好相反：那个量的是
        # 测试质量，这个量的是「这一刻构建出来的东西对不对」）。
        run: python scripts/audit_release_artifact.py

      - name: Reproducible build check (same source -> same bytes)
        # 第六道门禁。本项目的纪律是「同一版本号不得对应两套字节不同的产物」，
        # 但那只管住了「别把 A 版冒充成已发布的 A 版」，管不住「能不能从同一份
        # 源码重建出已发布的那一份」。实测：wheel 设 SOURCE_DATE_EPOCH 后即可复现，
        # sdist 连内层 tar 的成员 mtime 都每次不同（PAX 头里存着带小数的 mtime）。
        # 只跑一个平台 —— 可复现性是构建器属性，与 OS 无关，三矩阵跑三遍纯属浪费。
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/build_repro.py --verify

      - name: Unit & integration tests with coverage
        # 措辞门禁的面 6 要拉 GitHub 的 Release 列表。**匿名的额度是每个 IP
        # 每小时 60 次** —— 共享出口 IP（CI runner、公司网络）很容易撞上限，
        # 撞了门禁就红，而**红的原因与仓库无关**（实测踩过：一次自测连续
        # 拉了几十次就把额度烧光，门禁当场红成「读不到 Release 列表」）。
        # 有 token 就用它：额度是 5000 次/小时。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 用 python 承载这段逻辑，而不是 shell：
        # Windows runner 的默认 shell 是 pwsh，`if !` / `2>/dev/null` 这类
        # bash 语法会直接 ParserError（run #159 就栽在这里）。`shell: python`
        # 在三个平台上行为一致。
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Windows runner 的控制台代码页是 cp1252，而下面要 print 中文。
          # 不先把 stdout/stderr 切到 utf-8，`print("实测覆盖率 …")` 会抛
          # UnicodeEncodeError，整个 step 直接红 —— 而红的原因跟覆盖率对账
          # 毫无关系，极容易误判成「Windows 覆盖率不对」。
          #
          # 这是 v2.9.0 刚在 CLI 上修过的同一个坑（scripts/prove.py 与
          # scripts/adversarial_eval.py 顶部都有这段重配），我把它搬进 CI 时
          # 漏了，于是 run #43 的 windows-3.12 又挂在同一步上。
          # tests/test_ci_step_execution.py 会在 cp1252 下真跑这段，别再退化回去。
          for _stream in (sys.stdout, sys.stderr):
              try:
                  _stream.reconfigure(encoding="utf-8", errors="replace")
              except (AttributeError, ValueError, OSError):
                  pass

          # 地板已抬到 3.11，mcp / web / ai 三个 extra 在所有矩阵上都装得上，
          # 所以覆盖率口径统一用 pyproject 的配置，不再需要临时 coveragerc 分支
          # （那条分支是 Python 3.9 时代的产物：mcp 装不上时把 mcp 包移出统计，
          # 免得跑不了的代码把门槛拖到不及格。现在没有"跑不了"的矩阵了。）
          rc = subprocess.call([
              sys.executable, "-m", "pytest",
              "--cov=log_ai_compressor",
              "--cov-report=term-missing",
              "--cov-report=xml",
              "--cov-fail-under=90",
          ])
          if rc:
              sys.exit(rc)

          # --cov-fail-under 只卡**地板**（90%），三个矩阵都卡。
          # 但 README 工程指标表里写的是**精确值**，而覆盖率是**平台相关**的：
          # 同一个仓库在 ubuntu 与 windows 上测出的百分比分母一样、分子不一样
          # （有跨平台 / 版本条件分支）。v2.9.1 第一次加这条时没想清楚，
          # 结果 run #40 只有 windows-3.12 挂 —— 而那不是 windows 有问题，
          # 是**我把一个平台相关的量当成了平台无关的**。
          #
          # 所以口径写死：README 那个数 = **ubuntu-3.12 的实测值**，
          # 对账只在参考矩阵上做；其余矩阵照打不误地报出数字，不参与判定。
          # 地板（90%）仍然三矩阵全卡 —— 真正的回归不会因此漏掉。
          #
          # 「参考矩阵」要**两维都比**。原先只比 os，于是 ubuntu-3.11 也
          # 参与了判定，而 README 里写的口径是 3.12 —— 代码与 AGENTS.md §4
          # 写的口径不一致。今天两者数值恰好相同所以没红，但那不是设计，
          # 是运气：哪天 3.11 的行覆盖不同，3.11 就会带着一句
          # 「README 的口径就是 ubuntu-3.12」的红，那是误导而不是门禁。
          is_ref = ("${{ matrix.os }}" == "ubuntu-latest"
                    and "${{ matrix.python }}" == "3.12")
          cov = Path("coverage.xml")
          src = ""
          try:
              src = cov.read_text(encoding="utf-8")
              pct = round(float(re.search(
                  r'line-rate="([0-9.]+)"', src).group(1)) * 100)
          except (OSError, AttributeError, ValueError):
              print("解析 coverage.xml 失败：文件不存在或格式不对")
              if is_ref:
                  sys.exit(1)
              print("非参考矩阵，跳过判定")
              pct = -1
          if pct >= 0:
              print(f"[${{ matrix.os }} ${{ matrix.python }}] 实测覆盖率 {pct}%")
          if pct >= 0 and is_ref:
              readme = Path("README.md").read_text(encoding="utf-8")
              claimed = re.search(r"覆盖率\s*\*\*(\d+)%\*\*", readme)
              if not claimed:
                  print("README 里找不到覆盖率写法，本门禁无法对账（别让它静默通过）")
                  sys.exit(1)
              if int(claimed.group(1)) != pct:
                  print(f"README 写覆盖率 {claimed.group(1)}%，"
                        f"ubuntu-3.12 实测 {pct}% —— README 的覆盖率口径就是"
                        f" ubuntu-3.12，二者必须相等")
                  sys.exit(1)
              print(f"覆盖率对账通过：README 与 ubuntu-3.12 实测均为 {pct}%")

              # 「漏行 N / M 语句」这两个数**此前没有任何门禁校过**。
              # 上面那段只读 line-rate、比的是百分比，而 README 那一行同时
              # 印着这两个明细 —— 整个仓库里一处「漏行」都搜不到（v2.11.2
              # 实测：grep 字面量为 0 命中，于是「没人校」这个结论成立；
              # 反过来，只搜字面量不足以下结论，要搜**它怎么被算出来**）。
              #
              # 一个没人复现过的数字等于营销，包括 README 里的。
              detail = re.search(r"漏行\s*([\d,]+)\s*/\s*([\d,]+)\s*语句",
                                 readme)
              if not detail:
                  print("README 里找不到「漏行 N / M 语句」，"
                        "本门禁无法对账（别让它静默通过）")
                  sys.exit(1)
              try:
                  n_valid = int(re.search(r'lines-valid="(\d+)"', src).group(1))
                  n_cov = int(re.search(r'lines-covered="(\d+)"', src).group(1))
              except (AttributeError, ValueError):
                  print("coverage.xml 里读不到 lines-valid / lines-covered")
                  sys.exit(1)
              c_missing = int(detail.group(1).replace(",", ""))
              c_valid = int(detail.group(2).replace(",", ""))
              if (c_valid, c_missing) != (n_valid, n_valid - n_cov):
                  print(f"README 写漏行 {c_missing} / {c_valid} 语句，"
                        f"ubuntu-3.12 实测 {n_valid - n_cov} / {n_valid} —— "
                        f"口径同样是 ubuntu-3.12，二者必须相等")
                  sys.exit(1)
              print(f"明细对账通过：漏行 {n_valid - n_cov} / {n_valid} 语句")

      - name: Performance regression (deterministic work counters)
        # 第十道门禁，也是唯一一道**不看墙钟**的性能门禁。
        # 墙钟跨机器不可比，且噪声只会向下 —— 把它做成红线只会收获一堆
        # 假红，然后某天被人加 --continue-on-error 关掉。
        # 硬门禁建在确定性计数上：同一份输入在任何 OS / Python 上必须
        # 得到同一个整数（similarity 回退次数、ratio 计算次数、簇数、
        # 条目数）。一次真实的性能回归必然让其中一个变大，且与机器无关。
        run: python scripts/perf_gate.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 第七道门禁单独一个 job。
  #
  # 为什么不在 `test` job 里：它的耗时与其它十道差一个数量级 ——
  # 97 条变异，每条都要重跑一组测试。实测（2026-10-21，ubuntu-3.12）：
  # 它**单独**就跑了 11 分钟往上；而 `test` job 的 `timeout-minutes: 20`
  # 是**整个 job** 的上限，不是那一步的。
  #
  # 于是长杆会吃光短杆的预算：2026-10-21 那次 `98378a3` 给措辞门禁加了
  # 渲染口径断言，测试步从 3.1 min 涨到 4.5 min、记分卡从 11.0 min 涨到
  # 14.7 min 还没跑完 —— job 在第 20 分钟被砍，run 结论是 **cancelled**，
  # 而**前面十道门禁全都 success**。一个把「十道过了、一道超时」显示成
  # 「整个 run 取消」的结论，比红本身更费时间：它让人先去猜是不是门禁坏了。
  #
  # 拆开之后：`test` job 回到 4~5 分钟，20 分钟的卡死预算**只**用来抓
  # 真正的卡死（核心层测试只要十几秒）；记分卡按自己的成本拿预算。
  # 两道门禁的结论也分开显示 —— 一道超时不会把另一道的结果一起吞掉。
  # ---------------------------------------------------------------------
  mutation:
    runs-on: ubuntu-latest
    # 只跑参考矩阵一条：变异测试量的是测试质量，与 OS / Python 版本无关，
    # 三矩阵跑三遍纯属浪费（与「构建可复现」那步同理）。
    # 放在独立 job 里就不需要 `if:` 条件了 —— 那一维由 job 本身声明。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # 同样必须取完整历史：记分卡里有几条变异直接改
          # tests/test_no_job_wording.py，而那道门禁要扫「全部历史版本的
          # 文件内容」与「全部提交信息」。浅克隆会让它退化成只看当前那一个
          # 版本 —— 那正是「扫了 0 个文件却报通过」那个形状的翻版。
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Mutation scorecard (do the tests still have teeth?)
        # 第七道门禁，也是唯一一道**关于测试本身**的门禁。
        #
        # 前面六道守的是「产品对不对」。这一道守的是「我们对不对的判断，
        # 是不是真的有人在管」——它把每一处**曾经让门禁失明的改动**固化成
        # 变异，逐条施加回去，看负责它的那组测试会不会红。
        #
        # 它回答的是测试领域里最核心、也最容易被糊弄过去的问题：
        # **「你凭什么说这些测试有意义？」**
        run: python scripts/mutation_scorecard.py
