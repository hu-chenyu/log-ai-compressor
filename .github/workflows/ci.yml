name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，避免队列堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false          # 矩阵里任一格失败不影响其它格的结果可见性
      matrix:
        include:
          # 三条矩阵的理由（别随手加）：
          #   3.11 = pyproject 的 requires-python 下限，改这里必须同步改那边
          #   3.12 = 当前最常用的版本
          #   windows = 行尾 / shell / 路径处理与 unix 不同，且本项目有
          #            start.bat 这个 Windows 一等入口，必须真机验
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20         # 核心层测试只要十几秒，卡住说明出了问题

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 关键：requirements-dev.txt 必须是合法的 pip requirements 文件。
          # 它内部是 `-r requirements.txt` + `-e .[web,mcp,ai]` + 测试工具，
          # 装的是本项目本体加运行时可选能力 —— 否则 test_web / test_mcp /
          # test_ai 会被 importorskip 跳过或因缺 httpx 在收集阶段就报错。
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check log_ai_compressor tests scripts

      - name: Unit & integration tests with coverage
        # 用 python 承载这段逻辑，而不是 shell：
        # Windows runner 的默认 shell 是 pwsh，`if !` / `2>/dev/null` 这类
        # bash 语法会直接 ParserError（run #159 就栽在这里）。`shell: python`
        # 在三个平台上行为一致。
        shell: python
        run: |
          import subprocess
          import sys

          # 地板已抬到 3.11，mcp / web / ai 三个 extra 在所有矩阵上都装得上，
          # 所以覆盖率口径统一用 pyproject 的配置，不再需要临时 coveragerc 分支
          # （那条分支是 Python 3.9 时代的产物：mcp 装不上时把 mcp 包移出统计，
          # 免得跑不了的代码把门槛拖到不及格。现在没有"跑不了"的矩阵了。）
          sys.exit(subprocess.call([
              sys.executable, "-m", "pytest",
              "--cov=log_ai_compressor",
              "--cov-report=term-missing",
              "--cov-report=xml",
              "--cov-fail-under=90",
          ]))

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
